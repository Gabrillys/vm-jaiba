<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vida e Ministério</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102f46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vida e Ministério">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f9;--surface:#fff;--surface2:#f7f9fb;--tx:#14202b;--mut:#5b6c7c;--bd:#e0e6ec;--bd2:#cdd6de;--brand:#102f46;--brand2:#1c5c88;--accent:#1c6aa3;--accent-tx:#fff;--tes:#2f7d7a;--min:#b7821a;--nvc:#9b2d3d;--vis:#2f4f6f;--ok:#157347;--okbg:#e3f4ea;--err:#b3261e;--errbg:#fbe9e7;--warnbg:#fff4d6;--r:12px;--sh:0 1px 2px rgba(16,32,46,.06),0 6px 18px rgba(16,32,46,.06);--ring:0 0 0 3px rgba(28,106,163,.28)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1319;--surface:#141d26;--surface2:#101922;--tx:#e8eef3;--mut:#9aabba;--bd:#24313d;--bd2:#33424f;--brand:#0a1d2b;--brand2:#143a54;--accent:#3d8fd0;--okbg:#12301f;--errbg:#3a1815;--warnbg:#3a2f10;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0}
.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top-in{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.logo svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand p{margin:0;color:#c9d9e6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#tabs{max-width:1040px;margin:6px auto 0;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:none;display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#c9d9e6;padding:11px 14px;font:inherit;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0}
nav#tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav#tabs button.on{color:#fff;border-bottom-color:#fff;font-weight:700}
nav#tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav#tabs .sh{display:none}
main{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
.page-h{margin:2px 0 14px}.page-h h2{font-size:21px;font-weight:700;letter-spacing:-.2px}.page-h p{margin:3px 0 0;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}
.card-h{padding:14px 16px 0}.card-h h3{font-size:15px;font-weight:700}.card-h p{margin:2px 0 0;color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
button.b,select,input,textarea{font:inherit;color:var(--tx)}
button.b{background:var(--brand);color:#fff;border:1px solid transparent;border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:600;line-height:1.2;transition:filter .12s,box-shadow .12s}
button.b:hover:not(:disabled){filter:brightness(1.12)}
button.b.primary{background:var(--accent);color:var(--accent-tx)}
button.b.sec{background:var(--surface);color:var(--brand2);border-color:var(--bd2)}
@media (prefers-color-scheme:dark){button.b.sec{color:#cfe0ec}}
button.b.sec:hover:not(:disabled){background:var(--surface2);filter:none;border-color:var(--accent)}
button.b:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,nav#tabs button:focus-visible,.wk-h:focus-visible,.chip:focus-visible,summary:focus-visible{outline:none;box-shadow:var(--ring)}
button.b:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:inline-flex}.btn-group .b{border-radius:0}.btn-group .b:first-child{border-radius:9px 0 0 9px}.btn-group .b:last-child{border-radius:0 9px 9px 0;border-left-width:0}
button.x{background:none;border:0;color:var(--err);cursor:pointer;font-size:17px;border-radius:8px;width:34px;height:34px}
button.x:hover{background:var(--errbg)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--bd2);border-radius:9px;padding:8px 10px;width:100%;transition:border-color .12s}
input:hover,select:hover,textarea:hover{border-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.toolbar{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 16px}
.tb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tb-row label{font-weight:600}
.tb-sep{height:1px;background:var(--bd)}
.tb-row select{max-width:280px;width:auto;min-width:200px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--okbg);border-color:transparent}.tag.err{color:var(--err);background:var(--errbg);border-color:transparent}
.wk{transition:box-shadow .15s}.wk:hover{box-shadow:0 2px 4px rgba(16,32,46,.08),0 10px 24px rgba(16,32,46,.09)}
.wk-h{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;user-select:none}
.wk-h .dt{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface2);border:1px solid var(--bd);padding:5px 0;line-height:1.1}
.wk-h .dt b{display:block;font-size:19px}.wk-h .dt span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
.wk.vis .dt{background:var(--vis);border-color:var(--vis)}.wk.vis .dt b,.wk.vis .dt span{color:#fff}
.wk.evt .dt{background:var(--errbg);border-color:transparent}.wk.evt .dt b{color:var(--err)}
.wk-h .tt{flex:1;min-width:0}.wk-h .tt b{display:block;font-size:15px}.wk-h .tt small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h .tg{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin:0 4px 3px 2px}
.wk.open .chev{transform:rotate(225deg);margin-bottom:-3px}
.wk-b{display:none;border-top:1px solid var(--bd)}.wk.open .wk-b{display:block}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 12px;vertical-align:top;text-align:left}
.pr td{border-top:1px solid var(--bd)}
.pr td.t{width:58px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.pr td.n{text-align:right;font-weight:600;color:var(--brand2);width:34%}
@media (prefers-color-scheme:dark){.pr td.n{color:#cfe0ec}}
.pr.sec td{color:#fff;font-weight:700;border:0;font-size:12.5px;letter-spacing:.5px;padding-top:6px;padding-bottom:6px}.pr.sec.tes td{background:var(--tes)}.pr.sec.min td{background:var(--min)}.pr.sec.nvc td{background:var(--nvc)}
.pr.abre td{background:var(--surface2)}
.pr .o{display:block;color:var(--mut);font-size:12px;font-weight:400}
.pr.av td.n{color:var(--err)}
.pr td.n select{width:100%;min-width:150px;margin-bottom:4px}
.nl{padding:12px 16px;background:var(--warnbg);border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nl label{font-weight:600}.nl input{flex:1;min-width:200px}
.nl .st{font-size:12px;color:var(--mut)}
.hist{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--bd)}.hist li:first-child{border-top:0}.hist small{display:block;color:var(--mut)}.hist .tx{min-width:0;overflow-wrap:anywhere}
.li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}.li:first-child{border-top:0}#tkLink{flex:1 1 100%;min-width:0}.li .tx{flex:1 1 190px;min-width:0;overflow-wrap:anywhere}.li .tx small{display:block;color:var(--mut)}.li .ac{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.lista{padding:0 16px 8px}
.lem{padding:12px 16px;border-top:1px solid var(--bd)}.lem table td{border-top:1px solid var(--bd);vertical-align:middle}.lem td.a{width:1%;white-space:nowrap;text-align:right}.lem small{display:block;color:var(--mut)}
a.b.wa{display:inline-block;background:#1b8f4c;color:#fff;border-radius:9px;padding:7px 14px;text-decoration:none;font-size:13px;font-weight:600}
a.b.wa:hover{filter:brightness(1.1)}
.vis-box{border-bottom:1px solid var(--bd);background:var(--surface2)}.vis-box .hint{padding:0 16px;margin:0 0 10px}
.man-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--surface2)}
.man-bar .hint{margin:0;flex:1 1 260px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:42px;height:24px;border-radius:99px;background:var(--bd2);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + .trk{background:var(--ok)}
.switch input:checked + .trk::after{transform:translateX(18px)}
.switch input:focus-visible + .trk{box-shadow:var(--ring)}
.av{display:block;color:var(--err);font-size:12px;font-weight:600;margin-top:2px}
.sub-box{background:var(--surface2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 0 8px}
.sub-box .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sub-box .opts .b{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.sub-box .opts small{font-weight:400;opacity:.85}
.pres .admin-only{display:none !important}
.pres nav#tabs button:not([data-v=prog]){display:none}
.pres nav#tabs{grid-template-columns:1fr}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--bd2);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{overflow-x:auto}.grid table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--surface2);position:sticky;top:0}
.grid td{border-bottom:1px solid var(--bd);vertical-align:middle}.grid td.c{text-align:center}.grid tr:last-child td{border-bottom:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:14px 16px 16px}
.form label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.actionbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:12px 0 6px;display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16222c;color:#fff;padding:11px 18px;border-radius:10px;max-width:92%;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:500}
#toast.err{background:var(--err)}
#busy{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:center;justify-content:center;z-index:15;backdrop-filter:blur(2px)}
#busy>div{background:var(--surface);padding:18px 24px;border-radius:12px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.spin{width:20px;height:20px;border:3px solid var(--bd2);border-top-color:var(--accent);border-radius:50%;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.empty{padding:30px 16px;text-align:center;color:var(--mut)}
details.ap>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:700}
details.ap>summary::-webkit-details-marker{display:none}
details.ap>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s}
details.ap[open]>summary::after{transform:rotate(225deg)}
.ap-body{padding:0 16px 14px;border-top:1px solid var(--bd)}.ap-body .bar{margin:12px 0 8px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--surface);color:var(--tx);width:min(480px,92vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(10,20,30,.45)}
@media (min-width:900px){.toolbar{grid-template-columns:auto 1px 1fr;align-items:center}.tb-sep{width:1px;height:34px}}
@media (max-width:760px){
  .top-in{padding:10px 14px 8px}
  .brand h1{font-size:16.5px}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;margin:0;padding:0;background:var(--surface);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(6,1fr);z-index:12;box-shadow:0 -4px 16px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom)}
  nav#tabs button{flex-direction:column;gap:2px;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);border-bottom:0;border-top:3px solid transparent;border-radius:0}
  nav#tabs button:hover{background:transparent;color:var(--accent)}
  nav#tabs button.on{color:var(--accent);border-top-color:var(--accent);border-bottom-color:transparent}
  nav#tabs .lg{display:none}nav#tabs .sh{display:inline}
  main{padding:14px 12px 96px}
  .page-h h2{font-size:19px}
  .wk-h{padding:11px 12px;gap:10px;flex-wrap:wrap}.wk-h .tt{flex:1 1 calc(100% - 140px)}.wk-h .tg{order:5;flex:1 1 100%;justify-content:flex-start}.wk-h .chev{order:3;margin-left:auto}
  .tb-row .b,.tb-row select{flex:1 1 auto}.btn-group{width:100%}.btn-group .b{flex:1}
  .pr{display:flex;flex-wrap:wrap}.pr td{border-top:0;padding:6px 12px}
  .pr{border-top:1px solid var(--bd)}.pr.sec{border-top:0}
  .pr td.t{flex:0 0 56px;width:auto}.pr td:nth-child(2){flex:1 1 calc(100% - 56px)}
  .pr td.n{flex:1 1 100%;width:auto;text-align:left;padding:0 12px 8px 68px}
  .pr.abre td[colspan]{flex:1 1 100%}.pr.sec td{flex:1 1 100%}
  .lem td.a{display:block;width:auto;text-align:left;padding-top:0;white-space:normal}.lem td.a .b,.lem td.a select{margin:2px 4px 2px 0}.lem tr{display:block;border-top:1px solid var(--bd);padding:6px 0}.lem table td{border-top:0}
  .grid th,.grid td{padding:6px 8px}
  .actionbar{bottom:62px}
  #toast{bottom:76px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></span><div><h1>Vida e Ministério</h1><p id="cong">Carregando…</p></div></div><button class="b" id="bHist" hidden disabled title="Retornar um passo" style="margin-left:auto;flex:none">↶ Retornar <span id="bHistN"></span></button></div>
  <nav id="tabs" aria-label="Seções">
    <button data-v="prog" class="on"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg><span class="lg">Programação</span><span class="sh">Programa</span></button>
    <button data-v="cad"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c2 .8 3 2.7 3 5.6"/></svg><span class="lg">Cadastros</span><span class="sh">Cadastros</span></button>
    <button data-v="ind"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg><span class="lg">Indisponibilidades</span><span class="sh">Ausências</span></button>
    <button data-v="vis"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="lg">Visita do SC</span><span class="sh">Visita</span></button>
    <button data-v="evt"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-1.8 4L16 12H5"/></svg><span class="lg">Eventos especiais</span><span class="sh">Eventos</span></button>
    <button data-v="cfg"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="lg">Configurações</span><span class="sh">Config.</span></button>
  </nav>
</header>
<main>
  <section id="v-prog"></section>
  <section id="v-cad" hidden></section>
  <section id="v-ind" hidden></section>
  <section id="v-vis" hidden></section>
  <section id="v-evt" hidden></section>
  <section id="v-cfg" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy"><div><span class="spin"></span><span id="busyTxt">Aguarde…</span></div></div>
<dialog id="dlg"><form method="dialog"><p><b>Colar vários nomes</b><br><span class="hint">Um nome por linha.</span></p><textarea id="dlgTxt" rows="10"></textarea><p style="text-align:right;margin-bottom:0"><button class="b sec" value="cancel">Cancelar</button> <button class="b primary" id="dlgOk" value="ok">Adicionar</button></p></form></dialog>

    location.href = location.pathname + '?t=' + t;
  };
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { if (b.dataset.v !== 'prog') b.style.display = 'none'; });
}
/* Retornar: volta UM passo por clique, como o "voltar" de um navegador (o sistema guarda os últimos 50 passos). Só Presidente Geral e administrador. */
S.hist = { n: 0, ultima: '' };
function atualizaHist() {
  var b = $('#bHist'); if (!b || b.hidden) return;
  call0('apiHistorico').then(function (d) {
    S.hist = { n: d.itens.length, ultima: d.itens.length ? d.itens[0].acao : '', quando: d.itens.length ? d.itens[0].quando : '' };
    b.disabled = !S.hist.n; $('#bHistN').textContent = S.hist.n ? '(' + S.hist.n + ')' : '';
    b.title = S.hist.n ? 'Retornar um passo — desfaz: ' + S.hist.ultima + ' (' + S.hist.quando + ')' : 'Nada para retornar';
  }, function () {});
}
function retornar() {
  if (!S.hist.n) return;
  if (!confirm('Retornar um passo?\n\nSerá desfeito: «' + S.hist.ultima + '»\n' + (S.hist.quando || '') + '\n\nNão há "avançar": confira antes de confirmar.')) return;
  task('Retornando um passo…', function () { return call0('apiDesfazer', 1); }).then(function (r) {
    toast('Desfeito: ' + (r.acoes && r.acoes[0] ? r.acoes[0] : 'último passo'));
    S.sem = {}; S.lem = {}; S.env = {}; S.cadSujo = false; S.estado = null; S.cat = null;
    var on = document.querySelector('#tabs button.on'); if (on) on.click();
    atualizaHist();
  }, function () {});
}
document.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('#bHist')) retornar(); });
function iniciar() {
  if (API_URL && !TOKEN) { acessoNegado(null); return; }
  call('apiPapel').then(function (p) {
    S.papel = p.papel; S.ate = p.ate;
    if (!p.papel) { acessoNegado(p); return; }
    if (p.papel === 'presidente') {
      document.body.classList.add('pres'); $('#cong').textContent = 'Presidente da semana · acesso até ' + p.ate;
      // o presidente da semana só tem a Programação: as demais áreas nem existem na tela dele
      [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { if (b.dataset.v !== 'prog' && b.parentNode) b.parentNode.removeChild(b); });
      ['cad', 'ind', 'vis', 'evt', 'cfg'].forEach(function (v) { var e = $('#v-' + v); if (e && e.parentNode) e.parentNode.removeChild(e); });
    }
    if (p.papel === 'admin' || p.papel === 'geral') { var bh = $('#bHist'); if (bh) { bh.hidden = false; atualizaHist(); } }
    carregarProg();
  }, function () { carregarProg(); });
}
iniciar();
</script>
